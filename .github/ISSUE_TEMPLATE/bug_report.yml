name: Bug Report
description: Report a bug in Chatify
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/munafio/chatify/issues) first.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Install Chatify ...
        2. Open /chatify ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.

  - type: input
    id: chatify-version
    attributes:
      label: Chatify version
      placeholder: e.g. 2.0.0-beta.1, 1.6.3

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: e.g. 11.48.0

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3.12

  - type: input
    id: browser
    attributes:
      label: Browser (if UI bug)
      placeholder: e.g. Chrome 131

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Paste relevant logs or attach screenshots.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report
          required: true
        - label: I tested on the latest release or beta
          required: true
